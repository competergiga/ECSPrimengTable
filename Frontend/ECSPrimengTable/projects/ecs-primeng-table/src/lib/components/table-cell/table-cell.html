<ng-container *ngIf="value !== null && value !== undefined">
  <ng-container *ngIf="col.dataType === DataType.Numeric && col.cellDisplay === CellDisplay.ProgressBar; else ecsElse6">
    <ng-container *ngIf="hasProgressValue">
      <div class="ecs-progress-cell"
        [pTooltip]="progressTooltip"
        [tooltipDisabled]="!col.dataTooltipShow"
        [showDelay]="200" tooltipPosition="top">
        <div class="ecs-progress-bar" role="progressbar"
          [attr.aria-label]="col.header"
          aria-valuemin="0" aria-valuemax="100"
          [attr.aria-valuenow]="progressValue"
          [attr.aria-valuetext]="value + ' %'">
          <div class="ecs-progress-bar-fill" [style.width.%]="progressValue"></div>
        </div>
      </div>
    </ng-container>
  </ng-container><ng-template #ecsElse6><ng-container *ngIf="col.filterPredefinedValuesName && col.filterPredefinedValuesName.length > 0; else ecsElse7">
    <div [ngStyle]="{
            'justify-content': getDataAlignHorizontalAsText(col.dataAlignHorizontal),
            'align-items': getDataAlignVerticalAsText(col.dataAlignVertical)
        }">
      <ng-container *ngIf="col.dataType === DataType.List; else ecsElse8">
        <ng-container *ngFor="let item of getListValues(col, rowData); trackBy: ecsTrack6; let $index = index; let $first = first; let $last = last; let $even = even; let $odd = odd; let $count = count">
          <ng-container *ngIf="getPredfinedFilterMatch(col, item) as option">
            <div style="display: inline-block; margin-right: 0.5rem;"
                [pTooltip]="getListTooltip(item, $index)"
              [escape]="false"
                [tooltipDisabled]="!col.dataTooltipShow"
                [showDelay]="700"
                tooltipPosition="top">
                <ecs-table-predefined-filters [option]="option" [col]="col" [selectable]="true" [rowData]="rowData" [globalSearchText]="globalSearchText"></ecs-table-predefined-filters>
            </div>
          </ng-container>
        </ng-container>
      </ng-container><ng-template #ecsElse8>
        <ng-container *ngIf="getPredfinedFilterMatch(col, value) as option">
          <div style="display: inline-block;"
            [pTooltip]="col.dataTooltipCustomColumnSource && col.dataTooltipCustomColumnSource.length > 0 
              ? rowData[col.dataTooltipCustomColumnSource] 
              : value"
            [tooltipDisabled]="!col.dataTooltipShow"
            [showDelay]="700"
            tooltipPosition="top">
            <ecs-table-predefined-filters [option]="option" [col]="col" [selectable]="true" [rowData]="rowData" [globalSearchText]="globalSearchText"></ecs-table-predefined-filters>
          </div>
        </ng-container>
      </ng-template>
    </div>
  </ng-container><ng-template #ecsElse7>
    <ng-container [ngSwitch]="col.dataType"><ng-container *ngSwitchCase="DataType.List">
        <ng-container *ngFor="let item of getListValues(col, rowData); trackBy: ecsTrack7; let $index = index; let $first = first; let $last = last; let $even = even; let $odd = odd; let $count = count">
          <span [innerHtml]="highlightText(item, col, globalSearchText)"
            [pTooltip]="getListTooltip(item, $index)"
            [escape]="false"
            [tooltipDisabled]="!col.dataTooltipShow"
            [showDelay]="700"
            tooltipPosition="top"></span><ng-container *ngIf="!$last"><span>;</span></ng-container>
        </ng-container>
      </ng-container><ng-container *ngSwitchCase="DataType.Boolean">
        <i class="pi"
          [pTooltip]="col.dataTooltipCustomColumnSource && col.dataTooltipCustomColumnSource.length > 0 
            ? rowData[col.dataTooltipCustomColumnSource] 
            : value"
          [tooltipDisabled]="!col.dataTooltipShow || !col.dataTooltipCustomColumnSource || col.dataTooltipCustomColumnSource.length === 0"
          [showDelay]="700"
          tooltipPosition="top"
          [style.color]="value ? 'green' : 'red'"
          [ngClass]="{ 'pi-check-circle': value, 'pi-times-circle': !value }">
        </i>
      </ng-container><ng-container *ngSwitchCase="DataType.Date">
        <div 
          [innerHtml]="highlightText(formatDate(value, col.dateFormat, col.dateTimezone, col.dateCulture), col, globalSearchText)"
          [pTooltip]="col.dataTooltipCustomColumnSource && col.dataTooltipCustomColumnSource.length > 0 
            ? rowData[col.dataTooltipCustomColumnSource] 
            : formatDate(value, col.dateFormat, col.dateTimezone, col.dateCulture)"
          [tooltipDisabled]="!col.dataTooltipShow"
          [showDelay]="700"
          tooltipPosition="top">
          {{ formatDate(value, col.dateFormat, col.dateTimezone, col.dateCulture) }}
        </div>
      </ng-container><ng-container *ngSwitchDefault>
        <div
          [innerHtml]="highlightText(value, col, globalSearchText)"
          [pTooltip]="col.dataTooltipCustomColumnSource && col.dataTooltipCustomColumnSource.length > 0 
            ? rowData[col.dataTooltipCustomColumnSource] 
            : value"
          [tooltipDisabled]="!col.dataTooltipShow"
          [showDelay]="700"
          tooltipPosition="top">
          {{ value }}
        </div>
      </ng-container></ng-container>
  </ng-template></ng-template>
</ng-container>
