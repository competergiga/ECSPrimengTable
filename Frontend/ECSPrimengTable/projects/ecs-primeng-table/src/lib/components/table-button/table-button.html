<ng-container *ngIf="button.visibleCondition?.(rowData) ?? true"> <!--If 'visibleCondition' is true or not defined-->
  <ng-container *ngIf="(button.enabledCondition?.(rowData) ?? true) || !button.conditionFailHide"> <!--Render button if 'enabledCondition' is true or undefined, OR if 'conditionFailHide' is false-->
    <p-button
      [ariaLabel]="(button.label || button.tooltip || '') | ecsTranslate"
      [disabled]="!(button.enabledCondition?.(rowData) ?? true)"
      [iconPos]="button.iconPos || 'left'"
      [pTooltip]="(button.tooltip || '') | ecsTranslate"
      [tooltipDisabled]="!button.tooltip || button.tooltip.length === 0"
      [showDelay]="700"
      tooltipPosition="top"
      [styleClass]="
        (isActionButton ? ' custom-small-btn' : '') +
        (button.rounded ? ' p-button-rounded' : '') +
        (button.raised ? ' p-button-raised' : '') +
        (button.variant === 'text' ? ' p-button-text' : '') +
        (button.variant === 'outlined' ? ' p-button-outlined' : '') +
        (button.class ? ' ' + button.class : '')
      "
      [icon]="button.icon || ''"
      [label]="(button.label || '') | ecsTranslate"
      [ngStyle]="getButtonStyle(button, isActionButton, isLastActionButton)"
      (onClick)="handleClick($event)"></p-button>
  </ng-container>
</ng-container>
